[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "routellect"
version = "0.1.0"
description = "Open-source LLM model selector: anonymous task features in, model decision out."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
proxy = [
  "starlette>=0.36,<1",
  "uvicorn[standard]>=0.27,<1",
  "litellm>=1.30,<2",
  "cryptography>=42,<44",
]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "python-dotenv>=1,<2",
]

[project.scripts]
routellect = "routellect.proxy:main"
routellect-runner = "routellect.runner:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"routellect.proxy" = ["static/*.html"]
